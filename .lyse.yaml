# Generated by Lyse 0.1.0 — edit if needed.
# Schema reference: https://github.com/lyse-labs/lyse/blob/main/docs/guide/configuration.md
designSystem:
  # Module du design system (composants Ds* enregistrés globalement).
  componentsModule: "@abi-shai/tolbi-design-system"

  # Éléments natifs → équivalent DS attendu (guide les agents + la règle no-native-element).
  elements:
    button: DsButton
    input: DsInputField
    select: DsInputDropdown
    textarea: DsTextareaField

  excludePaths:
    - "**/node_modules/**"
    - "**/dist/**"
    # App mobile React Native : stack distincte (Expo/RN), hors du DS Nuxt/Vue.
    - "mobile/**"
    # Sources de tokens partagées (définissent les valeurs, ne les consomment pas).
    - "shared/**"
    # Données mock : drapeaux pays, couleurs de logos d'organisations, palettes de graphes.
    - "src/data/**"
    # Artefact CSS compilé et minifié du package DS (styles scopés data-v-*), pas du source.
    - "src/assets/css/design-system.css"
    # Panneau de debug dev-only (jamais rendu en prod).
    - "src/components/debug/**"
    # Rendu data-viz sur canvas/WebGL (Cytoscape, MapLibre) et palettes de graphes :
    # les couleurs y sont passées à un contexte de rendu où les CSS custom properties
    # (var(--ds-*)) ne se résolvent pas — système de couleurs distinct du DS.
    - "src/components/graph/**"
    - "src/components/**/charts/**"
    - "src/components/id/CorrectionCarto.vue"
